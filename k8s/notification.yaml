---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app: notification
spec:
  ports:
    - name: http
      port: 3003
      targetPort: 3003
  selector:
    app: notification
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: skylwalker1470/poll-app-notification:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
